# StarDreamerChaosmos 配置文件
# 按组件名分段:每一段就是该组件的配置(顶层段 = 整组件配置)。
# 优先级:内置默认 < 本文件 < 环境变量(如 APP_GATEWAY__ADDR、APP_USER__DB)。

gateway:
  addr: 127.0.0.1:18080
  # web 框架后端,推荐 gin(原生路由、生态成熟;代价:路由不可摘除)。
  # 需要组件下线自动摘路由 / 热插拔,则改用 std(自研动态路由,可注册可摘除)。
  engine: gin

user:
  enable: true
  db:
    sql_name: sqlite      # sqlite | mysql | postgresql
    db_name: data/sdc.db  # sqlite:文件路径;mysql/pgsql:库名
  jwt:
    accessExpire: 120        # 访问令牌有效期(分钟),缺省 120
    refreshExpire: 168       # 刷新令牌有效期(小时),缺省 168
    accessTokenSecret: sdc-access-secret-change-me    # 访问令牌密钥(生产务必更换)
    refreshTokenSecret: sdc-refresh-secret-change-me  # 刷新令牌密钥(生产务必更换)
    issuer: StarDreamerChaosmos
  redis:                     # 组件自持的 Redis(黑名单缓存);addr 留空则仅用本地缓存
    addr: 127.0.0.1:6379
    password: ""
    db: 0
